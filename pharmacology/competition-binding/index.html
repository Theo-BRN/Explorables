<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"
    />
    <title>Competition Binding</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Layout: left = log competition graph, sliders, live equations; right = membrane schematic. Stacks on phones. */
      :root {
        --paper: #f5f7fa;
        --ink: #1d2733;
        --muted: #5b6878;
        --r: #2f6fb3;
        --nr: #b0422e;
        --rule: #d5dce5;
        --tint: #dde8f5;
        --lipid: #c9d2dd;
        --cyto: #eaeef3;
        --wall: #dfe4ea;
        --serif: "Source Serif 4", Georgia, serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #141a21;
          --ink: #e3e8ee;
          --muted: #93a0b0;
          --r: #7fb1ea;
          --nr: #ec8a74;
          --rule: #2c3643;
          --tint: #1f3149;
          --lipid: #34404e;
          --cyto: #19212a;
          --wall: #232c37;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --paper: #141a21;
        --ink: #e3e8ee;
        --muted: #93a0b0;
        --r: #7fb1ea;
        --nr: #ec8a74;
        --rule: #2c3643;
        --tint: #1f3149;
        --lipid: #34404e;
        --cyto: #19212a;
        --wall: #232c37;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 1.0625rem/1.65 var(--serif);
      }
      main {
        max-width: 72rem;
        margin: 0 auto;
        padding-block: 2.5rem;
        padding-inline: 1.25rem;
      }
      h1 {
        font-weight: 600;
        font-size: 1.7rem;
        line-height: 1.2;
        margin: 0;
      }
      .grid {
        display: grid;
        gap: 2rem 3rem;
        margin-top: 1.75rem;
        align-items: start;
      }
      @media (min-width: 58rem) {
        .grid {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        }
      }
      .left,
      .right {
        min-width: 0;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
      }

      label {
        display: grid;
        grid-template-columns: 2.5rem 1fr 8.5rem;
        align-items: center;
        gap: 1rem;
        margin: 0.6rem 0;
      }
      label > span:first-child {
        font-style: italic;
      }
      label.plain > span:first-child {
        font-style: normal;
      }
      label > span:last-child {
        text-align: right;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--ink);
      }
      input[type="range"]:focus-visible {
        outline: 2px solid var(--r);
        outline-offset: 4px;
      }
      .sliders {
        margin-top: 0.5rem;
      }
      .formula {
        font-size: 1.1rem;
        overflow-x: auto;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--rule);
      }

      /* graph */
      #graph {
        cursor: crosshair;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .axis {
        stroke: var(--muted);
        stroke-width: 1;
      }
      .grid-l {
        stroke: var(--rule);
        stroke-width: 1;
      }
      .tick {
        fill: var(--muted);
        font: 12px var(--serif);
        text-anchor: middle;
      }
      .tick.y {
        text-anchor: end;
        dominant-baseline: central;
      }
      .alabel {
        fill: var(--muted);
        font: italic 14px var(--serif);
        text-anchor: middle;
      }
      .tb {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2.5;
      }
      .nsb {
        fill: none;
        stroke: var(--muted);
        stroke-width: 2;
        stroke-dasharray: 7 4;
      }
      .nsbl {
        fill: var(--muted);
        font: 13px var(--serif);
      }
      /* specific binding is never measured directly: dashed, as derived */
      .ic {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.25;
        stroke-dasharray: 3 4;
        opacity: 0.6;
      }
      .icl {
        fill: var(--ink);
        font: 13px var(--serif);
      }
      label.u > span:first-child {
        color: var(--nr);
      }
      .drop {
        stroke: var(--ink);
        stroke-width: 1;
        stroke-dasharray: 2 3;
        opacity: 0.5;
        fill: none;
      }
      .pt {
        fill: var(--paper);
        stroke-width: 2;
      }
      .pt.t {
        stroke: var(--ink);
      }
      .pt.on {
        fill: var(--ink);
        stroke: var(--ink);
      }

      /* schematic */
      .sch-wrap {
        border: 1px solid var(--rule);
        border-radius: 6px;
        overflow: hidden;
        position: relative;
      }
      .note {
        fill: var(--muted);
        font: italic 12px var(--serif);
      }
      .zone {
        fill: var(--muted);
        font: 12px var(--serif);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .zone .vol {
        text-transform: none;
        letter-spacing: 0.02em;
      }
      .key {
        fill: var(--muted);
        font: 14px var(--serif);
        font-variant-numeric: tabular-nums;
        dominant-baseline: central;
      }
      .key tspan {
        font-weight: 600;
        fill: var(--ink);
      }
      .cyto {
        fill: var(--cyto);
      }
      .ecf {
        fill: var(--paper);
      }
      .wall {
        fill: var(--wall);
        stroke: var(--muted);
        stroke-width: 1.25;
      }
      .head {
        fill: var(--lipid);
      }
      .tail {
        stroke: var(--lipid);
        stroke-width: 1.5;
      }
      .prot {
        fill: var(--cyto);
        stroke: var(--muted);
        stroke-width: 1.25;
      }
      .rec path.body {
        fill: var(--tint);
        stroke: var(--muted);
        stroke-width: 1.25;
        transition: stroke 0.3s;
      }
      .rec.boundL path.body {
        stroke: var(--r);
        stroke-width: 2;
      }
      .rec.boundU path.body {
        stroke: var(--nr);
        stroke-width: 2;
      }
      .lig {
        fill: var(--r);
      }
      /* the label: a faint halo on every labelled molecule */
      .halo {
        fill: none;
        stroke: var(--r);
        stroke-width: 1.25;
        opacity: 0.45;
      }
      .ant {
        fill: var(--nr);
      }
      .crowd {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .rec .on-l,
      .rec .ant,
      .ns {
        opacity: 0;
        transform: translateY(-34px);
        transform-box: fill-box;
        transition:
          opacity 0.3s,
          transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .ns.fromleft {
        transform: translateX(-34px);
      }
      .ns.fromright {
        transform: translateX(34px);
      }
      .rec.boundL .on-l,
      .rec.boundU .ant,
      .ns.stuck {
        opacity: 1;
        transform: none;
      }
      .cword {
        fill: var(--muted);
        font: 600 14px var(--serif);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-anchor: middle;
      }
      .cval {
        fill: var(--ink);
        font: 600 26px var(--serif);
        font-variant-numeric: tabular-nums;
        text-anchor: middle;
      }
      .cval tspan {
        fill: var(--muted);
        font-size: 14px;
        font-weight: 400;
      }
      @media (prefers-reduced-motion: reduce) {
        .rec .on-l,
        .rec .ant,
        .rec path.body,
        .ns {
          transition: none;
        }
      }

      .back {
        display: inline-flex;
        gap: 0.4em;
        margin-bottom: 0.9rem;
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
      }
      .back:hover {
        color: var(--ink);
      }
      .back:focus-visible {
        outline: 2px solid var(--r);
        outline-offset: 3px;
        border-radius: 2px;
      }
      .back span {
        transition: transform 0.15s;
      }
      .back:hover span {
        transform: translateX(-3px);
      }
      @media (prefers-reduced-motion: reduce) {
        .back span {
          transition: none;
        }
      }
      .series {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 2rem;
        margin-top: 3rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--rule);
      }
      .series a {
        display: grid;
        gap: 0.15rem;
        color: inherit;
        text-decoration: none;
      }
      .series .next {
        margin-left: auto;
        text-align: right;
      }
      .series .lbl {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .series .nm {
        font-weight: 600;
      }
      .series a:hover .nm {
        color: var(--r);
      }
      .series a:focus-visible {
        outline: 2px solid var(--r);
        outline-offset: 3px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../../#pharmacology"><span aria-hidden="true">←</span> Explorables</a>
      <h1>Competition Binding</h1>
      <div class="grid">
        <div class="left">
          <svg
            id="graph"
            viewBox="0 0 400 280"
            role="img"
            aria-label="Bound labelled ligand against log unlabelled ligand concentration: total binding falls to the non-specific floor, with the IC50 halfway down"
          ></svg>
          <div class="sliders">
            <label for="dose" class="u"
              ><span>[U]</span
              ><input
                id="dose"
                type="range"
                min="-3"
                max="5"
                step="0.05"
                value="1" /><span id="doseV"></span
            ></label>
            <label for="ku" class="u"
              ><span>K<sub>U</sub></span
              ><input
                id="ku"
                type="range"
                min="7"
                max="10"
                step="0.01"
                value="9" /><span id="kuV"></span
            ></label>
            <label for="ns" class="plain"
              ><span>NSB</span
              ><input
                id="ns"
                type="range"
                min="0"
                max="200"
                step="1"
                value="100" /><span id="nsV"></span
            ></label>
          </div>
          <div class="formula" id="eq"></div>
        </div>
        <div class="right">
          <div class="sch-wrap">
            <svg
              id="sch"
              viewBox="0 0 600 470"
              role="img"
              aria-label="Membrane in an assay tube with a fixed amount of labelled ligand; as unlabelled ligand rises it takes over the receptors, but the labelled ligand stuck to the membrane and tube walls stays put"
            ></svg>
            <canvas class="crowd" aria-hidden="true"></canvas>
          </div>
        </div>
      </div>
      <nav class="series" aria-label="Pharmacology series">
        <a class="prev" href="../saturation-binding/">
          <span class="lbl"><span aria-hidden="true">←</span> Previous</span>
          <span class="nm">3 · Saturation Binding</span>
        </a>
        <a class="next" href="../affinity-efficacy/">
          <span class="lbl">Next <span aria-hidden="true">→</span></span>
          <span class="nm">5 · Affinity and Efficacy</span>
        </a>
      </nav>
    </main>

    <script>
      const doseEl = document.getElementById("dose"),
        kuEl = document.getElementById("ku"),
        nsEl = document.getElementById("ns");
      const PER_NM_FL = 0.6022, // molecules in 1 fL at 1 nM
        BMAX = 500, // fmol/mg protein
        L = 2, // nM labelled ligand: one fixed concentration
        KL = 1e9, // M⁻¹, the labelled ligand's affinity constant (K_D = 1 nM by saturation binding)
        LMIN = -3,
        LMAX = 5, // log10 [U] (nM) axis range
        YTOP = 800; // fmol/mg, y-axis

      // Labelled and unlabelled ligand competing for the same site (concentrations in nM, constants in M⁻¹)
      const occL = (u, Ku) => (KL * L * 1e-9) / (1 + KL * L * 1e-9 + Ku * u * 1e-9);
      const occU = (u, Ku) => (Ku * u * 1e-9) / (1 + KL * L * 1e-9 + Ku * u * 1e-9);
      // Non-specific binding never saturates, so no amount of U displaces it.
      // It's k[L], and [L] is fixed, so it's a constant floor.
      const total = (u, Ku, nsb) => BMAX * occL(u, Ku) + nsb;

      const fmtConc = (nM) =>
        nM < 1
          ? `${+(nM * 1e3).toPrecision(nM < 1e-3 ? 2 : 3)} pM`
          : nM < 1000
            ? `${+nM.toPrecision(3)} nM`
            : `${+(nM / 1e3).toPrecision(3)} µM`;
      const seeded = (seed) => () =>
        ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const pow10 = (e) =>
        `10<tspan baseline-shift="super" font-size="9">${String(e).replace("-", "−")}</tspan>`;
      const sub = (t, s) => `${t}<tspan baseline-shift="sub" font-size="9">${s}</tspan>`;
      const sci = (v) => {
        // [mantissa, exponent]
        const e = Math.floor(Math.log10(v));
        return [(v / Math.pow(10, e)).toFixed(1), e];
      };
      const sciTex = (v) => {
        const [m, e] = sci(v);
        return `${m}\\times10^{${e}}`;
      };
      const sup = (e) =>
        (e < 0 ? "⁻" : "") +
        String(Math.abs(e))
          .split("")
          .map((d) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d])
          .join("");
      const sciTxt = (v) => {
        const [m, e] = sci(v);
        return `${m} × 10${sup(e)}`;
      };

      // ---------- Graph (log [U]) ----------
      const G = { x0: 50, x1: 384, y0: 236, y1: 20 };
      const YMAX = YTOP * 1.04;
      const sx = (u) =>
        G.x0 +
        ((Math.min(LMAX, Math.max(LMIN, Math.log10(u))) - LMIN) / (LMAX - LMIN)) * (G.x1 - G.x0);
      const sy = (b) => G.y0 - (b / YMAX) * (G.y0 - G.y1);
      const graph = document.getElementById("graph");

      const path = (f) => {
        let d = "";
        for (let i = 0; i <= 200; i++) {
          const u = Math.pow(10, LMIN + ((LMAX - LMIN) * i) / 200);
          d += (i ? "L" : "M") + sx(u).toFixed(1) + "," + sy(f(u)).toFixed(1);
        }
        return d;
      };

      function drawGraph(u, Ku, ic50, nsb) {
        let s = "";
        for (let b = 0; b <= YTOP; b += 100) {
          s += `<line class="grid-l" x1="${G.x0}" x2="${G.x1}" y1="${sy(b)}" y2="${sy(b)}"/>`;
          if (b % 200 === 0) s += `<text class="tick y" x="${G.x0 - 8}" y="${sy(b)}">${b}</text>`;
        }
        for (let v = LMIN; v <= LMAX; v++) {
          s += `<line class="axis" x1="${sx(10 ** v)}" x2="${sx(10 ** v)}" y1="${G.y0}" y2="${G.y0 + 5}"/>`;
          if ((v - LMIN) % 2 === 0)
            s += `<text class="tick" x="${sx(10 ** v)}" y="${G.y0 + 20}">${pow10(v - 9)}</text>`;
        }
        s += `<line class="axis" x1="${G.x0}" x2="${G.x1}" y1="${G.y0}" y2="${G.y0}"/>`;
        s += `<line class="axis" x1="${G.x0}" x2="${G.x0}" y1="${G.y0}" y2="${G.y1}"/>`;
        s += `<text class="alabel" x="${(G.x0 + G.x1) / 2}" y="${G.y0 + 40}">[U] (M)</text>`;
        s += `<text class="alabel" transform="translate(12 ${(G.y0 + G.y1) / 2}) rotate(-90)">Bound (fmol/mg)</text>`;

        // IC50: total binding halfway between its top and the NSB floor
        const ix = sx(ic50),
          half = sy((total(0, Ku, nsb) + nsb) / 2);
        s += `<path class="ic" d="M${G.x0},${half} H${ix} V${G.y0}"/>`;

        s += `<path class="nsb" d="M${G.x0},${sy(nsb)} H${G.x1}"/>`;
        s += `<text class="nsbl" x="${G.x0 + 6}" y="${sy(nsb) - 7}">NSB</text>`;
        s += `<path class="tb" d="${path((x) => total(x, Ku, nsb))}"/>`;
        s += `<text class="icl" x="${ix + 4}" y="${G.y0 - 7}">${sub("IC", "50")}</text>`;

        const px = sx(u),
          pt = sy(total(u, Ku, nsb));
        s += `<path class="drop" d="M${px},${G.y0} V${pt}"/>`;
        s += `<circle class="pt t on" cx="${px}" cy="${pt}" r="5.5"/>`;
        graph.innerHTML = s;
      }

      function setFromPointer(e) {
        const rect = graph.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 400;
        const f = Math.min(1, Math.max(0, (x - G.x0) / (G.x1 - G.x0)));
        doseEl.value = LMIN + f * (LMAX - LMIN); // the slider snaps to its step
        render();
      }
      graph.addEventListener("pointerdown", (e) => {
        e.preventDefault(); // otherwise a drag can start a text selection
        graph.setPointerCapture(e.pointerId);
        setFromPointer(e);
      });
      graph.addEventListener("pointermove", (e) => {
        if (graph.hasPointerCapture(e.pointerId)) setFromPointer(e);
      });

      // ---------- Schematic (static; built once, then toggled) ----------
      const NS = "http://www.w3.org/2000/svg";
      const sch = document.getElementById("sch");
      const W = 600,
        H = 470,
        WL = 44, // inner faces of the tube walls
        WALL = 556,
        MEM_TOP = 296,
        MEM_BOT = 346;
      const T = MEM_TOP - 40,
        B = MEM_BOT + 34;
      const el = (tag, attrs, parent) => {
        const n = document.createElementNS(NS, tag);
        for (const k in attrs) n.setAttribute(k, attrs[k]);
        (parent || sch).appendChild(n);
        return n;
      };
      const diamond = (x, y, h) =>
        `M${x},${y - h} L${x + h},${y} L${x},${y + h} L${x - h},${y} Z`;
      const labelled = (x, y, r, parent, cls) => {
        const g = el("g", { class: cls }, parent);
        el("circle", { class: "halo", cx: x, cy: y, r: r + 3 }, g);
        el("circle", { class: "lig", cx: x, cy: y, r }, g);
        return g;
      };

      el("rect", { class: "ecf", x: 0, y: 0, width: W, height: MEM_BOT });
      el("rect", { class: "cyto", x: 0, y: MEM_BOT, width: W, height: H - MEM_BOT });

      // the same membrane as Saturation Binding: receptors in pairs, two other proteins, bare lipid between
      const LR = 7, // bound ligand radius
        rw = 12, // receptor half-width
        pw = 22, // other protein half-width
        recX = [70, 110, 200, 240, 330, 370, 470, 510],
        protX = [155, 420],
        NREC = recX.length;
      const covered = (x, pad) =>
        recX.some((c) => Math.abs(x - c) < rw + pad) ||
        protX.some((c) => Math.abs(x - c) < pw + pad);

      for (let x = WL + 5; x < WALL; x += 10) {
        for (const [y1, y2] of [
          [MEM_TOP + 4, MEM_TOP + 22],
          [MEM_BOT - 22, MEM_BOT - 4],
        ]) {
          el("line", { class: "tail", x1: x - 1.5, y1, x2: x - 1.5, y2 });
          el("line", { class: "tail", x1: x + 1.5, y1, x2: x + 1.5, y2 });
        }
        el("circle", { class: "head", cx: x, cy: MEM_TOP, r: 4.5 });
        el("circle", { class: "head", cx: x, cy: MEM_BOT, r: 4.5 });
      }
      const PT = MEM_TOP - 24, // top of the other proteins
        PB = MEM_BOT + 22;
      for (const x of protX)
        el("rect", { class: "prot", x: x - pw, y: PT, width: 2 * pw, height: PB - PT, rx: 16 });

      const recs = recX.map((x) => {
        const g = el("g", { class: "rec" }),
          nr = 8.5;
        el(
          "path",
          {
            class: "body",
            d: `M${x - rw},${B - 6} V${T + 5} Q${x - rw},${T} ${x - rw + 5},${T} H${x - nr} A${nr},${nr} 0 0 0 ${x + nr},${T} H${x + rw - 5} Q${x + rw},${T} ${x + rw},${T + 5} V${B - 6} Q${x + rw},${B} ${x + rw - 6},${B} H${x - rw + 6} Q${x - rw},${B} ${x - rw},${B - 6} Z`,
          },
          g,
        );
        labelled(x, T + 1, LR, g, "on-l");
        el("path", { class: "ant", d: diamond(x, T + 1, LR * 1.2) }, g);
        return g;
      });

      // tube walls down both sides
      el("rect", { class: "wall", x: WALL, y: -2, width: W - WALL + 2, height: H + 4 });
      el("rect", { class: "wall", x: -2, y: -2, width: WL + 2, height: H + 4 });
      el("text", {
        class: "zone",
        transform: `translate(${(WALL + W) / 2 + 4} 150) rotate(90)`,
        "text-anchor": "middle",
      }).textContent = "Tube wall";

      // Non-specific sites: bare lipid, the tops of other proteins, both tube walls.
      // [L] is fixed, so the same ones stay stuck whatever [U] does; only the NSB slider changes them.
      const rr = seeded(7);
      const sites = [];
      for (let x = WL + LR + 3; x < WALL - LR - 3; )
        if (!covered(x, LR + 1)) {
          sites.push({ x, y: MEM_TOP - 4.5 - LR, side: "" });
          x += 15;
        } else x++;
      for (const x of protX)
        for (const dx of [-11, 11]) sites.push({ x: x + dx, y: PT - LR, side: "" });
      for (let y = 64; y < MEM_TOP - 20; y += 15) {
        sites.push({ x: WALL - LR - 1, y, side: " fromleft" });
        sites.push({ x: WL + LR + 1, y, side: " fromright" });
      }
      const nsLayer = el("g", {});
      const nsDots = sites
        .map((p) => [rr(), p])
        .sort((a, b) => a[0] - b[0])
        .map(([, p]) => labelled(p.x, p.y, LR, nsLayer, "ns" + p.side));
      // fixed order for receptor binding, so changing [U] only swaps the ones it must
      const recOrder = recs.map((_, i) => [rr(), i]).sort((a, b) => a[0] - b[0]).map((p) => p[1]);

      el("text", { class: "zone", x: WL + 12, y: 26 }).innerHTML =
        `Assay tube · <tspan class="vol">10 fL</tspan>`;
      el("text", { class: "note", x: WL + 12, y: 44 }).textContent = "Not to scale";
      // key: free molecules in the volume shown
      labelled(420, 22, 5, null, "");
      el("path", { class: "ant", d: diamond(420, 44, 6) });
      const keyL = el("text", { class: "key", x: 434, y: 22 }),
        keyU = el("text", { class: "key", x: 434, y: 44 });

      // the counter only sees the label: it can't tell where the ligand is bound
      el("text", { class: "cword", x: (WL + WALL) / 2, y: 418 }).textContent = "Bound";
      const cval = el("text", { class: "cval", x: (WL + WALL) / 2, y: 450 });

      // free molecules on a canvas: at high [U] there are hundreds of thousands
      const V = 10, // fL shown
        SPREAD = 60, // placed without overlap; the rest at random
        SAT = 5, // enough molecules to cover the space this many times over: beyond that it looks solid
        ALPHA = 0.55,
        FREE = { x0: WL + 16, x1: WALL - 16, y0: 60, y1: T - 12 },
        FR = 4;
      const fr = seeded(31),
        fpt = () => ({
          x: FREE.x0 + fr() * (FREE.x1 - FREE.x0),
          y: FREE.y0 + fr() * (FREE.y1 - FREE.y0),
        }),
        fpts = [];
      for (let tries = 0; fpts.length < 2 * SPREAD && tries < 200000; tries++) {
        const p = fpt();
        if (
          fpts.every((q) => (q.x - p.x) ** 2 + (q.y - p.y) ** 2 > (FR * 3) ** 2) &&
          sites.every((q) => (q.x - p.x) ** 2 + (q.y - p.y) ** 2 > (LR + FR * 4) ** 2) // clear of the sticky sites
        )
          fpts.push(p);
      }
      const MAXDRAWN = Math.ceil(
        (SAT * (FREE.x1 - FREE.x0) * (FREE.y1 - FREE.y0)) / (2 * (FR * 1.2) ** 2),
      );
      while (fpts.length < 2 * MAXDRAWN) fpts.push(fpt());
      const nFreeL = Math.round(L * V * PER_NM_FL);
      let nFreeU = 0;

      const crowd = document.querySelector(".crowd"),
        cx = crowd.getContext("2d");
      function drawCrowd() {
        const w = Math.round(crowd.clientWidth * devicePixelRatio),
          h = Math.round(crowd.clientHeight * devicePixelRatio);
        if (crowd.width !== w || crowd.height !== h) {
          crowd.width = w;
          crowd.height = h;
        }
        cx.setTransform(1, 0, 0, 1, 0, 0); // clear the whole canvas, not just the last transform's view of it
        cx.clearRect(0, 0, w, h);
        cx.setTransform(w / W, 0, 0, h / H, 0, 0);
        const css = getComputedStyle(document.documentElement),
          colL = css.getPropertyValue("--r").trim(),
          colU = css.getPropertyValue("--nr").trim(),
          s = FR * 1.2,
          nU = Math.min(nFreeU, MAXDRAWN);
        cx.globalAlpha = ALPHA;
        cx.fillStyle = colU;
        for (let i = 0; i < nU; i++) {
          const p = fpts[2 * i + 1];
          cx.beginPath();
          cx.moveTo(p.x, p.y - s);
          cx.lineTo(p.x + s, p.y);
          cx.lineTo(p.x, p.y + s);
          cx.lineTo(p.x - s, p.y);
          cx.fill();
        }
        // the few labelled molecules go on top, so a crowd of U can't hide them
        for (let i = 0; i < nFreeL; i++) {
          const p = fpts[2 * i];
          cx.globalAlpha = 0.85;
          cx.fillStyle = colL;
          cx.beginPath();
          cx.arc(p.x, p.y, FR, 0, 2 * Math.PI);
          cx.fill();
          cx.globalAlpha = 0.45;
          cx.strokeStyle = colL;
          cx.lineWidth = 1;
          cx.beginPath();
          cx.arc(p.x, p.y, FR + 2.5, 0, 2 * Math.PI);
          cx.stroke();
        }
      }
      new ResizeObserver(drawCrowd).observe(crowd);
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawCrowd);

      function drawSchematic(u, Ku, nsb) {
        const nL = Math.round(NREC * occL(u, Ku)),
          nU = Math.min(NREC - nL, Math.round(NREC * occU(u, Ku)));
        // U takes receptors from the end of the order that L leaves last
        recOrder.forEach((i, rank) => {
          recs[i].classList.toggle("boundL", rank < nL);
          recs[i].classList.toggle("boundU", rank >= NREC - nU);
        });
        // one dot is Bmax / NREC, the same scale as the receptors
        const nNS = Math.min(nsDots.length, Math.round((nsb / BMAX) * NREC));
        nsDots.forEach((g, i) => g.classList.toggle("stuck", i < nNS));
        nFreeU = Math.round(u * V * PER_NM_FL);
        drawCrowd();
        keyL.innerHTML = `<tspan>${nFreeL.toLocaleString()}</tspan> labelled`;
        keyU.innerHTML = `<tspan>${nFreeU.toLocaleString()}</tspan> unlabelled`;
        cval.innerHTML = `${Math.round(total(u, Ku, nsb))} <tspan>fmol/mg</tspan>`;
      }

      // ---------- Render ----------
      function render() {
        const u = Math.pow(10, +doseEl.value),
          Ku = Math.pow(10, +kuEl.value), // M⁻¹
          ic50 = ((1 + KL * L * 1e-9) / Ku) * 1e9, // nM
          k = +nsEl.value,
          nsb = k * L;
        document.getElementById("doseV").textContent = fmtConc(u);
        document.getElementById("kuV").textContent = `${sciTxt(Ku)} M⁻¹`;
        document.getElementById("nsV").textContent = `${k} fmol/mg/nM`;
        katex.render(
          `\\begin{aligned} K_U &= \\frac{1 + K_L[L]}{IC_{50}} \\\\[0.8em] &= \\frac{1 + (${sciTex(KL)})(${sciTex(L * 1e-9)})}{${sciTex(ic50 * 1e-9)}} = \\mathbf{${sciTex(Ku)}}\\ \\text{M}^{-1} \\end{aligned}`,
          document.getElementById("eq"),
          { displayMode: true, throwOnError: false },
        );
        drawGraph(u, Ku, ic50, nsb);
        drawSchematic(u, Ku, nsb);
      }
      [doseEl, kuEl, nsEl].forEach((s) => s.addEventListener("input", render));
      render();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="../../assets/qr.js"></script>
  </body>
