<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splitting n! into r! and (n−r)!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f7fa; --ink: #1d2733; --muted: #5b6878;
    --r: #2f6fb3; --nr: #b0422e; --rule: #d5dce5;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141a21; --ink: #e3e8ee; --muted: #93a0b0;
      --r: #7fb1ea; --nr: #ec8a74; --rule: #2c3643;
    }
  }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 1.0625rem/1.65 "Source Serif 4", Georgia, serif;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { font-weight: 600; font-size: 1.9rem; line-height: 1.2; margin: 0 0 .75rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  .stage {
    overflow-x: auto; padding: 2.5rem 0 2rem; margin: 1rem 0 2rem;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    font-size: 1.35rem; text-align: center;
  }
  .controls { display: grid; gap: 1.25rem; }
  label { display: grid; grid-template-columns: 5rem 1fr 2rem; align-items: center; gap: 1rem; }
  label span:last-child { text-align: right; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  input[type=range]:focus-visible { outline: 2px solid var(--r); outline-offset: 4px; }
  #result { margin-top: 2rem; font-size: 1.15rem; overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>Where r! and (n−r)! live inside n!</h1>
  <p>Both are tails of the same product. Move r and watch one brace grow while the other shrinks. Dividing n! by both leaves the number of ways to choose r items from n.</p>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <label><span>n</span><input id="n" type="range" min="3" max="10" value="8"><span id="nv"></span></label>
    <label><span>r</span><input id="r" type="range" min="1" max="7" value="6"><span id="rv"></span></label>
  </div>

  <div id="result"></div>
</main>

<script>
  const nEl = document.getElementById('n'), rEl = document.getElementById('r');
  const fact = k => k <= 1 ? 1 : k * fact(k - 1);
  const terms = (hi, lo) => Array.from({length: hi - lo + 1}, (_, i) => hi - i).join('\\cdot ');
  const cR = s => `\\color{var(--r)}{${s}}`;

  function render() {
    const n = +nEl.value;
    rEl.max = n - 1;
    if (+rEl.value > n - 1) rEl.value = n - 1;
    const r = +rEl.value, m = n - r;
    document.getElementById('nv').textContent = n;
    document.getElementById('rv').textContent = r;

    // Both braces cover a tail (k down to 1), so the smaller always nests inside the larger.
    const big = Math.max(r, m), small = Math.min(r, m);
    const outside = big < n ? terms(n, big + 1) + '\\cdot ' : '';
    const between = big > small ? terms(big, small + 1) + '\\cdot ' : '';
    const inner = terms(small, 1);
    const top = `\\color{#R}{\\overbrace{\\color{#INK}{X}}^{${r}!}}`;
    const bot = `\\color{#NR}{\\underbrace{\\color{#INK}{X}}_{(${n}-${r})!}}`;
    const [outerT, innerT] = r >= m ? [top, bot] : [bot, top];
    let tex = `${n}! = ${outside}` + outerT.replace('X', between + innerT.replace('X', inner));

    const css = getComputedStyle(document.documentElement);
    const col = v => css.getPropertyValue(v).trim();
    tex = tex.replaceAll('#R', col('--r')).replaceAll('#NR', col('--nr')).replaceAll('#INK', col('--ink'));
    katex.render(tex, document.getElementById('stage'), {displayMode: true, throwOnError: false});

    const res = `\\binom{${n}}{${r}} = \\frac{${n}!}{${r}!\\,(${n}-${r})!} = \\frac{${fact(n)}}{${fact(r)}\\cdot ${fact(m)}} = ${fact(n) / (fact(r) * fact(m))}`;
    katex.render(res, document.getElementById('result'), {displayMode: true, throwOnError: false});
  }
  nEl.addEventListener('input', render);
  rEl.addEventListener('input', render);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  render();
</script>
</body>
</html>
